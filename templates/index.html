<!-- templates/index.html -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EHF Champions League 2026/27 - Player Database</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 40px;
            text-align: center;
        }

        .header h1 {
            font-size: 32px;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .tabs {
            display: flex;
            border-bottom: 2px solid #e0e0e0;
            background: #f5f5f5;
        }

        .tab {
            flex: 1;
            padding: 15px;
            text-align: center;
            cursor: pointer;
            border: none;
            background: none;
            font-size: 16px;
            font-weight: 600;
            color: #666;
            transition: all 0.3s;
        }

        .tab.active {
            color: #667eea;
            border-bottom: 3px solid #667eea;
            background: white;
        }

        .tab:hover {
            background: white;
        }

        .content {
            padding: 40px;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
        }

        .search-box input {
            flex: 1;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.3s;
        }

        .search-box input:focus {
            border-color: #667eea;
        }

        .search-box button {
            padding: 12px 30px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: background 0.3s;
        }

        .search-box button:hover {
            background: #764ba2;
        }

        .player-detail {
            background: #f5f5f5;
            padding: 30px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }

        .player-detail.show {
            display: block;
        }

        .player-header {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 30px;
        }

        .player-icon {
            width: 80px;
            height: 80px;
            background: #667eea;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            color: white;
        }

        .player-info h2 {
            color: #333;
            font-size: 28px;
            margin-bottom: 5px;
        }

        .player-info p {
            color: #666;
            font-size: 14px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .stat-box {
            background: white;
            padding: 20px;
            border-radius: 8px;
            border-left: 4px solid #667eea;
            text-align: center;
        }

        .stat-label {
            color: #999;
            font-size: 12px;
            text-transform: uppercase;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .stat-value {
            color: #667eea;
            font-size: 32px;
            font-weight: bold;
        }

        .error {
            background: #ffe0e0;
            color: #d32f2f;
            padding: 15px;
            border-radius: 8px;
            display: none;
            margin-bottom: 20px;
        }

        .error.show {
            display: block;
        }

        .loading {
            text-align: center;
            color: #999;
            display: none;
            margin: 20px 0;
        }

        .loading.show {
            display: block;
        }

        .players-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 500px;
            overflow-y: auto;
        }

        .player-item {
            background: white;
            padding: 15px;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 4px solid #667eea;
            cursor: pointer;
            transition: background 0.3s;
        }

        .player-item:hover {
            background: #f9f9f9;
        }

        .player-name {
            flex: 1;
        }

        .player-name strong {
            color: #333;
            display: block;
            font-size: 16px;
        }

        .player-name small {
            color: #999;
            display: block;
            font-size: 12px;
        }

        .player-stats-summary {
            text-align: right;
            font-size: 12px;
        }

        .player-stats-summary div {
            color: #667eea;
            font-weight: 600;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: #999;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🏑 EHF Champions League</h1>
            <p>2026/27 - Player Database</p>
        </div>

        <div class="tabs">
            <button class="tab active" onclick="switchTab('jogadores')">👤 JOGADORES</button>
            <button class="tab" onclick="switchTab('historico')">📊 HISTÓRICO DE TIME</button>
        </div>

        <div class="content">
            <!-- Aba Jogadores -->
            <div id="jogadores" class="tab-content active">
                <div class="search-box">
                    <input 
                        type="text" 
                        id="searchInput" 
                        placeholder="Escolha o Player"
                        autocomplete="off"
                    >
                    <button onclick="buscar()">PROCURAR PARTIDAS</button>
                </div>

                <div class="loading" id="loading">🔄 Buscando...</div>
                <div class="error" id="error"></div>

                <div class="player-detail" id="playerDetail">
                    <div class="player-header">
                        <div class="player-icon">⚽</div>
                        <div class="player-info">
                            <h2 id="playerName"></h2>
                            <p id="playerTeam"></p>
                        </div>
                    </div>

                    <div class="stats-grid">
                        <div class="stat-box">
                            <div class="stat-label">Total Match</div>
                            <div class="stat-value" id="playerGames">0</div>
                        </div>
                        <div class="stat-box">
                            <div class="stat-label">Med/Gols</div>
                            <div class="stat-value" id="playerMediaGols">0</div>
                        </div>
                        <div class="stat-box">
                            <div class="stat-label">Med/Gols/7M</div>
                            <div class="stat-value" id="playerMedia7m">0</div>
                        </div>
                        <div class="stat-box">
                            <div class="stat-label">Med/Tentativas</div>
                            <div class="stat-value" id="playerMediaTentativas">0</div>
                        </div>
                        <div class="stat-box">
                            <div class="stat-label">Med/Converting</div>
                            <div class="stat-value" id="playerTaxaConversao">0%</div>
                        </div>
                    </div>

                    <div class="stats-grid">
                        <div class="stat-box">
                            <div class="stat-label">Total Gols</div>
                            <div class="stat-value" id="playerTotalGols">0</div>
                        </div>
                        <div class="stat-box">
                            <div class="stat-label">Total 7M</div>
                            <div class="stat-value" id="playerTotal7m">0</div>
                        </div>
                        <div class="stat-box">
                            <div class="stat-label">Total Tentativas</div>
                            <div class="stat-value" id="playerTotalTentativas">0</div>
                        </div>
                    </div>
                </div>

                <h3 style="margin-bottom: 15px; color: #333;">Top Scorers 2026/27</h3>
                <div class="players-list" id="playersList"></div>
            </div>

            <!-- Aba Histórico de Time -->
            <div id="historico" class="tab-content">
                <div class="empty-state">
                    <p>📊 Recurso em desenvolvimento</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        function switchTab(tab) {
            // Remove active de todas as abas
            document.querySelectorAll('.tab-content').forEach(el => {
                el.classList.remove('active');
            });
            document.querySelectorAll('.tab').forEach(el => {
                el.classList.remove('active');
            });

            // Ativa a aba selecionada
            document.getElementById(tab).classList.add('active');
            event.target.classList.add('active');
        }

        window.onload = function() {
            carregarTodos();
        };

        function buscar() {
            const termo = document.getElementById('searchInput').value.trim();
            
            if (termo.length < 2) {
                mostrarErro('Digite pelo menos 2 caracteres');
                return;
            }

            const loading = document.getElementById('loading');
            const error = document.getElementById('error');
            const detail = document.getElementById('playerDetail');

            loading.classList.add('show');
            error.classList.remove('show');
            detail.classList.remove('show');

            fetch(`/api/search?q=${encodeURIComponent(termo)}`)
                .then(response => {
                    if (!response.ok) throw new Error('Jogador não encontrado');
                    return response.json();
                })
                .then(data => {
                    loading.classList.remove('show');
                    
                    document.getElementById('playerName').textContent = data.name;
                    document.getElementById('playerTeam').textContent = data.team || 'Unknown';
                    document.getElementById('playerGames').textContent = data.games;
                    document.getElementById('playerMediaGols').textContent = data.media_gols;
                    document.getElementById('playerMedia7m').textContent = data.media_7m;
                    document.getElementById('playerMediaTentativas').textContent = data.media_tentativas;
                    document.getElementById('playerTaxaConversao').textContent = data.taxa_conversao + '%';
                    
                    document.getElementById('playerTotalGols').textContent = data.goals;
                    document.getElementById('playerTotal7m').textContent = data.seven_meter;
                    document.getElementById('playerTotalTentativas').textContent = data.attempts;

                    detail.classList.add('show');
                })
                .catch(err => {
                    loading.classList.remove('show');
                    mostrarErro('Jogador não encontrado');
                });
        }

        function carregarTodos() {
            fetch('/api/todos')
                .then(response => response.json())
                .then(data => {
                    const playersList = document.getElementById('playersList');
                    playersList.innerHTML = '';

                    data.forEach(jogador => {
                        const html = `
                            <div class="player-item" onclick="selecionarJogador('${jogador.name}')">
                                <div class="player-name">
                                    <strong>${jogador.name}</strong>
                                    <small>${jogador.team || 'Unknown'}</small>
                                </div>
                                <div class="player-stats-summary">
                                    <div>Jogos: ${jogador.games}</div>
                                    <div>Gols: ${jogador.goals} (${jogador.media_gols})</div>
                                </div>
                            </div>
                        `;
                        playersList.innerHTML += html;
                    });
                });
        }

        function selecionarJogador(nome) {
            document.getElementById('searchInput').value = nome;
            buscar();
        }

        function mostrarErro(mensagem) {
            const error = document.getElementById('error');
            error.textContent = '❌ ' + mensagem;
            error.classList.add('show');
        }

        document.getElementById('searchInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') buscar();
        });
    </script>
</body>
</html>
